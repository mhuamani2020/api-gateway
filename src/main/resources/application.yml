spring:
  application:
    name: api-gateway
  # ========================================================================
  # Parte I: configuracion externalizada con un Config Server.
  # Todo lo demas (puerto, rutas de Spring Cloud Gateway y Eureka) vive en el
  # repositorio de configuracion que sirve el config-server:
  #   - bank-config-repo/api-gateway.yml    (ejecucion local)
  #   - deploy/config-repo/api-gateway.yml  (ejecucion con docker-compose)
  # ========================================================================
  config:
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
